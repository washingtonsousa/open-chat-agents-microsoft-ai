services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.2
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    ports:
      - "8085:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing myminio/kb-documents &&
      mc admin config set myminio notify_amqp:1 enable=on url='amqp://guest:guest@rabbitmq:5672' exchange=minio-events exchange_type=fanout durable=on mandatory=off no_wait=off &&
      mc admin service restart myminio --json ;
      sleep 5 &&
      mc event remove myminio/kb-documents --force > /dev/null 2>&1 ;
      mc event add myminio/kb-documents arn:minio:sqs::1:amqp --event put
      "

  # --- Langfuse (observabilidade OTel, self-hosted) ---------------------------------------
  langfuse-postgres:
    image: postgres:17-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    ports:
      - "8123:8123"
      - "9010:9000"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-redis:
    image: redis:7-alpine
    restart: always
    command: ["--requirepass", "langfusesecret", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "langfusesecret", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  langfuse-minio:
    image: minio/minio
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9090:9000"
      - "9091:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 10

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: always
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    ports:
      - "3030:3030"
    environment: &langfuse-worker-env
      DATABASE_URL: postgresql://postgres:postgres@langfuse-postgres:5432/postgres
      SALT: "02243f57b009ec931d828e1c48e9f9c1"
      ENCRYPTION_KEY: "0d8a2bd5664a794c66913ac5cfda4ba6888efd511fd7a9b34adcafe48dc5bf27"
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: langfusesecret

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: always
    depends_on: *langfuse-depends-on
    ports:
      - "3001:3000"
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: "d997148f4a68139b45cab08c61cec4dc818f92600e5e51c4ecb7fd546aa57409"
      LANGFUSE_INIT_ORG_ID: open-chat-agents
      LANGFUSE_INIT_ORG_NAME: Open Chat Agents
      LANGFUSE_INIT_PROJECT_ID: open-chat-agents
      LANGFUSE_INIT_PROJECT_NAME: open-chat-agents
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "pk-lf-228513a470bbd3f458d52d4fdf5110c4"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "sk-lf-816a3ea0ecd755b9e20b66c608e215ad"
      LANGFUSE_INIT_USER_EMAIL: admin@open-chat-agents.local
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: "37fcb22760bb6049"

  backend:
    build: ./backend
    ports:
      - "8090:8090"
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=chatbot;Username=postgres;Password=postgres"
      AppSettings__OllamaBaseUrl: "http://host.docker.internal:11434"
      AppSettings__LlmModel: "gemma3"
      AppSettings__CorsOrigins__0: "http://localhost:3000"
      AppSettings__Minio__Endpoint: "minio:9000"
      AppSettings__Minio__AccessKey: "minioadmin"
      AppSettings__Minio__SecretKey: "minioadmin"
      AppSettings__Minio__Bucket: "kb-documents"
      AppSettings__RabbitMq__HostName: "rabbitmq"
      AppSettings__RabbitMq__ExchangeName: "minio-events"
      AppSettings__RabbitMq__QueueName: "kb-ingestion"
      AppSettings__Weaviate__RestEndpoint: "weaviate"
      AppSettings__Weaviate__RestPort: "8080"
      AppSettings__Weaviate__GrpcEndpoint: "weaviate"
      AppSettings__Weaviate__GrpcPort: "50051"
      AppSettings__Telemetry__Enabled: "true"
      AppSettings__Telemetry__OtlpEndpoint: "http://langfuse-web:3000/api/public/otel"
      AppSettings__Telemetry__LangfusePublicKey: "pk-lf-228513a470bbd3f458d52d4fdf5110c4"
      AppSettings__Telemetry__LangfuseSecretKey: "sk-lf-816a3ea0ecd755b9e20b66c608e215ad"
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      minio:
        condition: service_healthy
      langfuse-web:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=chatbot;Username=postgres;Password=postgres"
      AppSettings__OllamaBaseUrl: "http://host.docker.internal:11434"
      AppSettings__Minio__Endpoint: "minio:9000"
      AppSettings__Minio__AccessKey: "minioadmin"
      AppSettings__Minio__SecretKey: "minioadmin"
      AppSettings__Minio__Bucket: "kb-documents"
      AppSettings__RabbitMq__HostName: "rabbitmq"
      AppSettings__RabbitMq__ExchangeName: "minio-events"
      AppSettings__RabbitMq__QueueName: "kb-ingestion"
      AppSettings__Weaviate__RestEndpoint: "weaviate"
      AppSettings__Weaviate__RestPort: "8080"
      AppSettings__Weaviate__GrpcEndpoint: "weaviate"
      AppSettings__Weaviate__GrpcPort: "50051"
      AppSettings__Telemetry__Enabled: "true"
      AppSettings__Telemetry__OtlpEndpoint: "http://langfuse-web:3000/api/public/otel"
      AppSettings__Telemetry__LangfusePublicKey: "pk-lf-228513a470bbd3f458d52d4fdf5110c4"
      AppSettings__Telemetry__LangfuseSecretKey: "sk-lf-816a3ea0ecd755b9e20b66c608e215ad"
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      langfuse-web:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090
    depends_on:
      - backend

volumes:
  postgres_data:
  weaviate_data:
  minio_data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_minio_data:
